name: "Release Desktop Apps (Windows & macOS)"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--bundles nsis'
            asset_path: 'apps/desktop/src-tauri/target/release/bundle/nsis/*.exe'
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin --bundles dmg'
            asset_path: 'apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile=false

      - name: Build Tauri Desktop App
        run: pnpm --filter @readixon/desktop tauri build ${{ matrix.args }}

      - name: Upload Release Asset to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
