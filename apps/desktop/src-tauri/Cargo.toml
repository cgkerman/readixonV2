[package]
name = "readixon-desktop"
version = "0.1.0"
description = "Readixon Masaüstü Uygulaması (Windows & macOS)"
authors = ["Readixon Team <support@readixon.com>"]
edition = "2021"

[lib]
name = "readixon_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
